name: YouTube videos on the homepage

# Every 30 minutes: read the YouTube channel's public feed and keep assets/yt/videos.json at the 10 newest
# videos, with a thumbnail for each. The homepage reads that file, so a new upload shows up on its own.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: youtube-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install the image library for thumbnails
        run: pip install --quiet pillow

      - name: Update the video list
        run: |
          python3 - <<'PY'
          """Keep the homepage's video list in step with the YouTube channel.

          Reads the channel's public feed, keeps assets/yt/videos.json at the 10 newest videos (newest first, Shorts left
          out) and saves a 640x360 thumbnail for each one as assets/yt/<id>-640.jpg. When an 11th video arrives, the
          oldest one drops off the list. Runs every 30 minutes as part of this workflow.

          Test without internet: save this script as a .py file and run it with --feed saved-feed.xml --offline
          """
          import datetime
          import io
          import json
          import os
          import re
          import sys
          import urllib.request
          import xml.etree.ElementTree as ET

          CHANNEL = 'UCygxEgOUNR5GjXVA-mn8eaA'          # youtube.com/@risarezaei
          OUT = 'assets/yt/videos.json'
          MAX = 10
          NS = {'a': 'http://www.w3.org/2005/Atom', 'yt': 'http://www.youtube.com/xml/schemas/2015', 'm': 'http://search.yahoo.com/mrss/'}
          # card title, line and length (seconds) written by hand; any other video uses its YouTube title (the part
          # before " | " as the title, the next part as the line, or else the first sentence of its description)
          NOTES = {
              'RGWDGXYPWnY': ['How much water did your lake lose?', 'Any lake, one click, with GSW Lake Explorer', 142],
              'bDhEnSg61W8': ['Three days of rain — Iran’s floods and a record El Niño', 'Floods across Iran, 6–8 November 2026', 137],
              'rBgaC2yz1hw': ['A wetland being dug out — 15 years of satellite images', 'Kiakalayeh wetland, Langarud', 63],
          }
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36'
          PERSIAN = re.compile('[؀-ۿ]')


          def get(url, data=None, headers=None):
              h = {'User-Agent': UA, 'Accept-Language': 'en-US,en;q=0.8', 'Cookie': 'CONSENT=YES+cb; SOCS=CAI'}
              h.update(headers or {})
              with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=h), timeout=30) as r:
                  return r.read()


          def card_text(title, desc):
              parts = [p.strip() for p in title.split(' | ') if p.strip() and not PERSIAN.search(p)] or [title.strip()]
              head, sub = parts[0], (parts[1] if len(parts) > 1 else '')
              if not sub:
                  line = next((l.strip() for l in desc.splitlines() if l.strip() and not PERSIAN.search(l)), '')
                  m = re.match(r'(.+?[.?!])(\s|$)', line)
                  line = m.group(1) if m else line
                  sub = line if len(line) <= 90 else line[:87].rsplit(' ', 1)[0] + '…'
              return head, sub


          def length(vid):
              """Video length in seconds: from its YouTube page, or else from YouTube's player data (None if neither gives it)."""
              try:
                  html = get('https://www.youtube.com/watch?v=' + vid).decode('utf-8', 'replace')
                  m = re.search(r'"lengthSeconds":"(\d+)"', html)
                  if m:
                      return int(m.group(1))
                  m = re.search(r'itemprop="duration" content="PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?"', html)
                  if m and any(m.groups()):
                      return sum(int(x or 0) * k for x, k in zip(m.groups(), (3600, 60, 1)))
              except Exception as e:
                  print('  watch page not readable for', vid, '-', e)
              try:
                  body = json.dumps({'videoId': vid, 'context': {'client': {'clientName': 'WEB', 'clientVersion': '2.20250101.00.00', 'hl': 'en'}}}).encode()
                  j = json.loads(get('https://www.youtube.com/youtubei/v1/player?prettyPrint=false', body, {'Content-Type': 'application/json'}))
                  n = int((j.get('videoDetails') or {}).get('lengthSeconds') or 0)
                  if n:
                      return n
              except Exception as e:
                  print('  player data not readable for', vid, '-', e)
              print('  no length for', vid)
              return None


          def thumb(vid):
              """Save a 640x360 thumbnail once; True if it exists."""
              path = 'assets/yt/%s-640.jpg' % vid
              if os.path.exists(path):
                  return True
              from PIL import Image
              for name in ('maxresdefault', 'hq720', 'sddefault', 'hqdefault'):
                  try:
                      im = Image.open(io.BytesIO(get('https://i.ytimg.com/vi/%s/%s.jpg' % (vid, name)))).convert('RGB')
                  except Exception:
                      continue
                  if im.width < 400:          # YouTube's small placeholder when that size doesn't exist
                      continue
                  w, h = im.size
                  th = round(w * 9 / 16)      # the 4:3 sizes carry black bars: keep the 16:9 middle
                  if th < h:
                      top = (h - th) // 2
                      im = im.crop((0, top, w, top + th))
                  im.resize((640, 360), Image.LANCZOS).save(path, 'JPEG', quality=84, optimize=True, progressive=True)
                  print('  thumbnail saved:', path, 'from', name)
                  return True
              print('  no thumbnail for', vid)
              return False


          def recent(published, days=7):
              try:
                  t = datetime.datetime.fromisoformat(published.replace('Z', '+00:00'))
              except ValueError:
                  return False
              return datetime.datetime.now(datetime.timezone.utc) - t < datetime.timedelta(days=days)


          def main():
              args = sys.argv[1:]
              offline = '--offline' in args
              try:
                  if '--feed' in args:
                      xml = open(args[args.index('--feed') + 1], 'rb').read()
                  else:
                      xml = get('https://www.youtube.com/feeds/videos.xml?channel_id=' + CHANNEL)
                  root = ET.fromstring(xml)
              except Exception as e:
                  print('feed not readable, list left as it is:', e)
                  return
              old = json.load(open(OUT, encoding='utf-8')) if os.path.exists(OUT) else {}
              known = {v['id']: v for v in old.get('videos', [])}
              vids = []
              for e in root.findall('a:entry', NS):
                  vid = e.findtext('yt:videoId', '', NS).strip()
                  link = (e.find('a:link', NS).get('href', '') if e.find('a:link', NS) is not None else '')
                  if not vid or '/shorts/' in link:
                      continue
                  title = e.findtext('a:title', '', NS).strip()
                  desc = e.findtext('m:group/m:description', '', NS) or ''
                  note = NOTES.get(vid)
                  head, sub = note[:2] if note else card_text(title, desc)
                  pub = e.findtext('a:published', '', NS).strip()
                  # the length is looked up while a video is less than a week old; after that it stays as it is
                  ln = (note[2] if note else None) or known.get(vid, {}).get('len')
                  if not ln and not offline and recent(pub):
                      ln = length(vid)
                  if not offline:
                      thumb(vid)
                  vids.append({'id': vid, 'title': head, 'sub': sub, 'published': pub, 'len': ln})
              vids.sort(key=lambda v: v['published'], reverse=True)
              vids = vids[:MAX]
              if not vids:
                  print('feed had no videos, list left as it is')
                  return
              now = datetime.datetime.now(datetime.timezone.utc)
              try:
                  age = (now - datetime.datetime.strptime(old.get('checked', ''), '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.timezone.utc)).days
              except ValueError:
                  age = 999
              # rewritten when the list changes, and at least every 25 days: GitHub pauses a scheduled job in a
              # repository with no activity for 60 days, and this small update keeps it running
              if vids == old.get('videos') and age < 25:
                  print('no change:', ', '.join(v['id'] for v in vids))
                  return
              os.makedirs(os.path.dirname(OUT), exist_ok=True)
              with open(OUT, 'w', encoding='utf-8') as f:
                  json.dump({'channel': CHANNEL, 'checked': now.strftime('%Y-%m-%dT%H:%M:%SZ'), 'videos': vids}, f, ensure_ascii=False, indent=1)
                  f.write('\n')
              print('list updated:', ', '.join(v['id'] for v in vids))


          if __name__ == '__main__':
              main()
          PY

      - name: Save the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/yt
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Videos: update the list from the YouTube channel"
          git pull --rebase --quiet origin main
          git push origin HEAD:main
          echo "PUSHED=1" >> "$GITHUB_ENV"

      # commits made by this job don't rebuild the website by themselves, so ask for a rebuild
      - name: Rebuild the website
        if: env.PUSHED == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
