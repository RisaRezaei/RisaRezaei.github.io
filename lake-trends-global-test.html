<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Global Lake Area Trends | Parisa Abbasalizadehrezaei</title>
<meta name="description" content="Permanent and seasonal water in all 1.43 million HydroLAKES lakes, 1984–2021, from JRC Global Surface Water at 30 m: trends, abrupt shifts, seasonality and lake behavior.">
<link rel="icon" href="favicon.ico">
<script>if(/[?&]embed/.test(location.search))document.documentElement.classList.add('embed')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&family=Encode+Sans+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>:root{--rail:#060a12;--panel:#0d1524;--panel2:#16213a;--hair:#1c2940;--ink:#f1f5fb;--text:#b9c5d9;--dim:#7c8aa3;--accent:#4fd1c5;--dec:#e66767;--inc:#3987e5;--neu:#64748b;--perm:#199e70;--seas:#9085e9;--sh:0 1px 3px rgba(0,0,0,.55);--ff:"Encode Sans",system-ui,sans-serif;--fc:"Encode Sans Condensed","Encode Sans",system-ui,sans-serif;--railw:76px;--draw:400px;--rih:min(72px,calc((100vh - 76px)/9.2))}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#05080f;color:var(--text);font:13px/1.5 var(--ff);overflow:hidden}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
svg.i{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
#map{position:fixed;left:var(--railw);top:0;right:0;bottom:0;background:#05080f}
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--railw);z-index:1200;display:flex;flex-direction:column;background:var(--rail);box-shadow:0 2px 4px #000000bf}
.logo{display:flex;flex-direction:column;align-items:center;justify-content:center;height:76px;color:var(--accent);background:var(--rail)}
.logo:hover{text-decoration:none;color:#8de8df}
.logo b{display:block;font:800 26px/.92 var(--fc)}
.logo b+b{font-size:17.5px;line-height:1}
.logo i{margin-top:3px;font:600 9px/1 var(--ff);font-style:normal;color:var(--dim)}
.rail button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:var(--railw);height:var(--rih);padding:0 2px;border:0;background:none;color:var(--dim);font:400 10px/1.15 var(--ff);text-transform:uppercase;cursor:pointer;transition:color .2s,background .2s}
.rail button svg{width:24px;height:24px;flex:none}
.rail button:hover{color:var(--ink)}
.rail button.on{background:var(--panel2);color:var(--ink)}
.rail button.on svg{color:var(--accent)}
.rail-tools{margin-top:auto}
.m-only{display:none!important}
.topbar{position:fixed;right:20px;top:20px;z-index:1100;display:flex;background:var(--rail);box-shadow:var(--sh)}
.topbar button{display:flex;align-items:center;justify-content:center;width:42px;height:38px;border:0;background:none;color:var(--text);cursor:pointer}
.topbar button:hover{color:var(--accent)}
.topbar svg{width:18px;height:18px;stroke-width:1.5}
.layer{position:fixed;left:calc(var(--railw) + 10px);top:10px;width:272px;max-height:calc(100% - 20px);overflow-y:auto;z-index:1100;background:var(--panel);box-shadow:var(--sh);transition:left .3s cubic-bezier(.3,.7,.2,1)}
body.dopen .layer{left:calc(var(--railw) + var(--draw) + 10px)}
.lh{display:flex;align-items:center;gap:8px;padding:14px 10px 12px 20px}
.lh h2{flex:1;margin:0;font:600 13px/1.3 var(--ff);color:var(--ink)}
.lh button{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;background:none;color:var(--text);cursor:pointer}
.lh button svg{width:14px;height:14px;stroke-width:1.6;transition:transform .25s}
.layer.min .lh button svg{transform:rotate(180deg)}
.layer.min .lbd{display:none}
.lbd{padding:0 20px 16px}
.ld{margin:0 0 14px;font-size:11px;line-height:1.5;color:var(--dim)}
.lg{display:grid;grid-template-columns:106px minmax(0,1fr);gap:0 14px}
.lt{margin:0 0 7px;font-size:10.5px;color:var(--text)}
.lt span{color:var(--dim)}
.lt2{margin-top:14px}
.rd{display:flex;align-items:center;gap:8px;width:100%;padding:4px 0;border:0;background:none;color:var(--text);font:400 11px/1.3 var(--ff);text-align:left;cursor:pointer}
.rd i{flex:none;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--dim)}
.rd:hover{color:var(--ink)}
.rd.on{color:var(--accent);font-weight:600}
.rd.on i{border:0;background:var(--accent);box-shadow:0 0 0 3px #4fd1c52e}
.inl{display:flex;gap:14px;margin-bottom:12px}
.inl .rd{width:auto}
.vleg{display:flex;gap:10px;height:156px}
.vleg .bar{display:flex;flex-direction:column;gap:2px;width:12px;flex:none;border-radius:6px;overflow:hidden}
.vleg .bar i{display:block}
.vleg .lab{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.vleg .lab span{display:flex;flex-direction:column;justify-content:center;font-size:10.5px;line-height:1.25;color:var(--text)}
.vleg .lab em{font-style:normal;font-size:10px;color:var(--dim)}
.fam{margin:9px 0 2px;font-size:10px;color:var(--dim);text-transform:uppercase}
.fam:first-of-type{margin-top:0}
.cl{display:flex;align-items:center;gap:8px;width:100%;padding:3.5px 0;border:0;background:none;color:var(--text);font:400 11px/1.3 var(--ff);text-align:left;cursor:pointer}
.cl i{flex:none;width:9px;height:9px;border-radius:50%}
.cl span{flex:1}
.cl em{font-style:normal;font-size:10px;color:var(--dim)}
.cl:hover{color:var(--ink)}
.cl.on{color:var(--accent);font-weight:600}
.cl.off{opacity:.42}
.layer select{width:100%;padding:6px 8px;border:0;border-radius:0;background:var(--panel2);color:var(--text);font:400 11px var(--ff)}
.tg{display:flex;align-items:center;gap:10px;margin-top:14px;padding:0;border:0;background:none;color:var(--text);font:400 11px var(--ff);cursor:pointer}
.tg i{position:relative;flex:none;width:28px;height:14px;border-radius:7px;background:#34425c;transition:background .2s}
.tg i:after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#cfd8e6;transition:left .2s,background .2s}
.tg.on i{background:var(--accent)}
.tg.on i:after{left:16px;background:#04121a}
.ln{margin:12px 0 0;font-size:10px;color:var(--dim)}
.drawer{position:fixed;left:var(--railw);top:0;bottom:0;width:var(--draw);z-index:1150;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);box-shadow:2px 0 6px #00000073;transform:translate(-105%);visibility:hidden;transition:transform .3s cubic-bezier(.3,.7,.2,1),visibility 0s .3s}
.drawer.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.3,.7,.2,1)}
.dh{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:16px;padding:20px 12px 14px 20px;background:var(--panel)}
.dh b{font:700 13px/1 var(--ff);text-transform:uppercase;color:var(--ink)}
.dh .pin{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text)}
.dh .pin svg{width:14px;height:14px}
.dh .x{margin-left:auto;width:30px;height:30px;border:0;background:none;color:var(--dim);font:400 20px/1 var(--ff);cursor:pointer}
.dh .x:hover{color:var(--ink)}
.db{padding:2px 20px 30px}
.db p{margin:0 0 12px;font-size:12.5px;line-height:1.6}
.db h4{margin:22px 0 8px;font:600 11.5px/1.3 var(--ff);text-transform:uppercase;color:var(--ink)}
.db h4:first-child{margin-top:6px}
.bk{display:inline-flex;align-items:center;gap:6px;margin:0 0 14px;padding:0;border:0;background:none;color:var(--accent);font:600 11.5px var(--ff);cursor:pointer}
.bk svg{width:12px;height:12px;stroke-width:1.8}
.lk h3{margin:0;font:700 28px/1.08 var(--fc);color:var(--ink)}
.lm{margin:5px 0 0!important;font-size:11.5px!important;color:var(--dim)}
.beh{display:flex;gap:9px;margin:14px 0 0;font-size:12.5px;line-height:1.55}
.beh i{flex:none;width:9px;height:9px;margin-top:5px;border-radius:50%}
.beh b{color:var(--ink);font-weight:600}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:18px 0 20px}
.tri div{padding:0 12px;border-left:1px solid var(--hair)}
.tri div:first-child{padding-left:0;border-left:0}
.tri span{display:block;font-size:10.5px;color:var(--dim)}
.tri b{display:flex;align-items:center;gap:6px;margin-top:2px;font:700 23px/1.15 var(--fc);color:var(--ink)}
.tri b svg{width:9px;height:9px;flex:none}
.tri b.ns{font:500 15px/1.75 var(--fc);color:var(--dim)}
.tri em{display:block;font-style:normal;font-size:10px;color:var(--dim)}
.acc section{border-top:1px solid var(--hair)}
.acc section:last-child{border-bottom:1px solid var(--hair)}
.ah{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 10px;border:1px solid transparent;background:none;color:var(--dim);font:600 11.5px/1 var(--ff);text-transform:uppercase;text-align:left;cursor:pointer}
.ah:hover{color:var(--ink)}
.ah svg.ic{width:20px;height:20px;flex:none}
.ah span{flex:1}
.ah svg.ch{width:14px;height:14px;flex:none;color:var(--accent);stroke-width:1.7;transition:transform .25s}
section.open>.ah{color:var(--ink);border-color:var(--accent)}
section.open>.ah svg.ch{transform:rotate(180deg)}
.ab{display:none;padding:16px 2px 20px}
section.open>.ab{display:block}
.ab h5{margin:20px 0 8px;font:600 11px/1.3 var(--ff);color:var(--text)}
.story{margin:14px 0 0!important;font-size:12.5px!important;line-height:1.65!important;color:var(--text)}
.story b{color:var(--ink);font-weight:600}
.keys{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:6px;font-size:11px;color:var(--text)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:9px;height:9px}
.keys .dash{width:14px;height:0;border-top:2px dashed var(--ink)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:500 10px var(--fc);fill:#7c8aa3}
.ctip{position:absolute;z-index:3;pointer-events:none;min-width:150px;padding:8px 10px;background:var(--rail);box-shadow:0 2px 8px #0009;font-size:11.5px;line-height:1.5;opacity:0;transition:opacity .12s}
.ctip b{display:block;font:700 13px var(--fc);color:var(--ink)}
.ctip .r{display:flex;justify-content:space-between;gap:12px;color:var(--dim)}
.ctip .r em{font-style:normal;font-weight:600;color:var(--ink)}
.ctip .r i{display:inline-block;width:8px;height:8px;margin-right:6px}
table.tt{width:100%;border-collapse:collapse;font-size:12px}
.tt th{padding:0 0 6px;font:400 10.5px var(--ff);color:var(--dim);text-align:right}
.tt th:first-child,.tt td:first-child{text-align:left}
.tt td{padding:7px 0;border-top:1px solid var(--hair);text-align:right;white-space:nowrap}
.tt td:first-child i{display:inline-block;width:9px;height:9px;margin-right:8px}
.tt .v{font:700 14px var(--fc);color:var(--ink)}
.tt .ok{color:var(--dim)}
.tnote{margin-top:8px;font-size:10.5px;line-height:1.5;color:var(--dim)}
.sg{display:grid;grid-template-columns:118px 86px minmax(0,1fr);font-size:12px}
.sg>*{padding:7px 0;border-top:1px solid var(--hair)}
.sg span{color:var(--dim)}
.sg b{font:700 14px/1.4 var(--fc);color:var(--ink)}
.sg em{font-style:normal;font-size:11px;line-height:1.45;color:var(--dim)}
.bud{display:grid;grid-template-columns:70px minmax(0,1fr) 124px;gap:8px 10px;align-items:center;font-size:12px}
.bud .bt{position:relative;height:14px}
.bud .bt:before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;border-left:1px solid #2a3a55}
.bud .bt i{position:absolute;top:2px;height:10px}
.bud em{font:600 12px var(--fc);font-style:normal;color:var(--ink);text-align:right;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px;font-size:12px}
.facts div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--hair);color:var(--dim)}
.facts b{font-weight:600;color:var(--ink);text-align:right}
.u{font-family:var(--ff)}
.rankline{margin-top:6px;font-size:12px;color:var(--dim)}
.rankline b{color:var(--ink)}
.rk ol{margin:0;padding:0;list-style:none;counter-reset:i}
.rk li{counter-increment:i;display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--hair);font-size:12.5px;cursor:pointer}
.rk li:before{content:counter(i);width:16px;font-size:10.5px;color:var(--dim)}
.rk li .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk li:hover .n{color:var(--accent)}
.rk li .v{font:600 13px var(--fc);color:var(--ink)}
.rk li.empty{cursor:default;color:var(--dim)}
.rk li.empty:before{content:none}
.vw{display:flex;gap:12px;width:100%;padding:10px 0;border:0;border-top:1px solid var(--hair);background:none;text-align:left;cursor:pointer;color:var(--text)}
.vw i{flex:none;width:14px;height:14px;margin-top:2px;border-radius:50%;border:1.5px solid var(--dim)}
.vw b{display:block;font:600 13px var(--ff);color:var(--ink)}
.vw span{display:block;font-size:11px;line-height:1.45;color:var(--dim)}
.vw.on i{border:0;background:var(--accent);box-shadow:0 0 0 3px #4fd1c52e}
.vw.on b{color:var(--accent)}
.pill{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 18px;border:0;border-radius:999px;background:var(--accent);color:#04121a;font:700 10.5px/1 var(--ff);text-transform:uppercase;cursor:pointer}
.pill:hover{background:#8de8df;text-decoration:none}
.pill.ghost{background:none;box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.pill.ghost:hover{background:#4fd1c51f}
.tip b{font-weight:600}
.tip span{color:var(--dim)}
body .fx-curtain{z-index:3000}
.bm-img{filter:brightness(var(--bmb,.6)) saturate(.82);transition:filter .35s}
.bm-lab{opacity:.88}
.toast{position:fixed;left:50%;bottom:26px;z-index:1300;transform:translate(-50%);padding:9px 16px;background:var(--rail);color:var(--ink);font-size:12px;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.embed{--rih:min(72px,calc(100vh/9.2))}
.embed .logo{display:none}
@media(max-width:1180px){:root{--draw:360px}
body.dopen .layer{display:none}
}
@media(max-width:820px){:root{--draw:100%}
#map{left:0;bottom:58px}
.rail{top:auto;right:0;width:auto;height:58px;flex-direction:row;box-shadow:0 -2px 4px #0009}
.rail-views{display:none}
.rail-tools{display:flex;width:100%;margin:0!important}
.rail button{flex:1;width:auto;height:58px}
.m-only{display:flex!important}
.logo{position:fixed;left:0;top:0;width:62px;height:62px;box-shadow:var(--sh)}
.logo b{font-size:21px}
.logo b+b{font-size:14px}
.logo i{font-size:7.5px}
.topbar{right:10px;top:10px}
.topbar button{width:40px}
.layer{left:0!important;right:0;top:auto;bottom:58px;width:auto;max-height:62vh;display:none;box-shadow:0 -2px 6px #0009}
body.legend .layer,.layer.min .lbd{display:block}
.lg{grid-template-columns:130px minmax(0,1fr)}
.drawer{inset:auto 0 58px;width:auto;max-height:60vh;transform:translateY(110%);box-shadow:0 -2px 6px #0009}
.dh{padding-top:16px}
.toast{bottom:74px}
}

.maplibregl-ctrl-attrib{background:#060a12cc!important;color:#7c8aa3!important;font:10px var(--ff)!important}
.maplibregl-ctrl-attrib a{color:#7c8aa3!important}
.maplibregl-ctrl-attrib-button{filter:invert(.75)}
.maplibregl-ctrl-scale{border:1px solid #8793a8!important;border-top:0!important;background:var(--rail)!important;color:#cfd8e6!important;font:600 10px/1.4 var(--ff)!important;padding:2px 8px!important}
.maplibregl-ctrl-bottom-right{margin:0 12px 6px 0}
.maplibregl-canvas{outline:none}
#hov{position:fixed;z-index:1250;pointer-events:none;padding:6px 9px;background:var(--rail);color:var(--ink);box-shadow:var(--sh);font:12px/1.4 var(--ff);opacity:0;transition:opacity .1s;white-space:nowrap}
#hov b{display:block;font-weight:600}
#hov span{color:var(--dim)}
.layer,.rail-views,.rail-tools,.topbar{opacity:0;transition:opacity .4s}
body.ready .layer,body.ready .rail-views,body.ready .rail-tools,body.ready .topbar{opacity:1}
.cl span em{font-size:10px;color:var(--dim)}
.db h4{margin:18px 0 6px}
.rk li .n .u{font-size:11px}
.tri b{flex-wrap:nowrap;white-space:nowrap}
.tri b.ns{white-space:normal}
</style>
</head>
<body>
<nav class="rail" aria-label="Map views and tools">
  <a class="logo" href="index.html#lake-map" title="Back to Parisa's site"><b>LAKE</b><b>TRENDS</b><i>1984–2021</i></a>
  <div class="rail-views" id="railViews"></div>
  <div class="rail-tools" id="railTools"></div>
</nav>
<div id="map"></div>
<div class="topbar" id="topbar"></div>
<section class="layer" id="layer" aria-label="Current view"></section>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div id="hov" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
