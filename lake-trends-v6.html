<style>
/* Layout language after soilgrids.org: a full-bleed map, a slim icon rail, flat square panels. Colours: the site's navy, teal and blue. */
:root{--rail:#060a12;--panel:#0d1524;--panel2:#16213a;--hair:#1c2940;--ink:#f1f5fb;--text:#b9c5d9;--dim:#7c8aa3;--accent:#4fd1c5;
  --dec:#e66767;--inc:#3987e5;--neu:#64748b;--perm:#199e70;--seas:#9085e9;
  --sh:0 1px 3px rgba(0,0,0,.55);--ff:"Encode Sans",system-ui,sans-serif;--fc:"Encode Sans Condensed","Encode Sans",system-ui,sans-serif;
  --railw:76px;--draw:400px;--rih:min(72px,calc((100vh - 76px)/9.2))}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#05080f;color:var(--text);font:13px/1.5 var(--ff);overflow:hidden}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
svg.i{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
#map{position:fixed;left:var(--railw);top:0;right:0;bottom:0;background:#05080f}

/* ---------- icon rail ---------- */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--railw);z-index:1200;display:flex;flex-direction:column;background:var(--rail);box-shadow:0 2px 4px rgba(0,0,0,.75)}
.logo{display:flex;flex-direction:column;align-items:center;justify-content:center;height:76px;color:var(--accent);background:var(--rail)}
.logo:hover{text-decoration:none;color:#8de8df}
.logo b{display:block;font:800 26px/.92 var(--fc)}
.logo b+b{font-size:17.5px;line-height:1}
.logo i{margin-top:3px;font:600 9px/1 var(--ff);font-style:normal;color:var(--dim)}
.rail button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:var(--railw);height:var(--rih);padding:0 2px;border:0;background:none;color:var(--dim);font:400 10px/1.15 var(--ff);text-transform:uppercase;cursor:pointer;transition:color .2s,background .2s}
.rail button svg{width:24px;height:24px;flex:none}
.rail button:hover{color:var(--ink)}
.rail button.on{background:var(--panel2);color:var(--ink)}
.rail button.on svg{color:var(--accent)}
.rail-tools{margin-top:auto}
.m-only{display:none!important}

/* ---------- top-right map controls ---------- */
.topbar{position:fixed;right:20px;top:20px;z-index:1100;display:flex;background:var(--rail);box-shadow:var(--sh)}
.topbar button{display:flex;align-items:center;justify-content:center;width:42px;height:38px;border:0;background:none;color:var(--text);cursor:pointer}
.topbar button:hover{color:var(--accent)}
.topbar svg{width:18px;height:18px;stroke-width:1.5}

/* ---------- active layer panel ---------- */
.layer{position:fixed;left:calc(var(--railw) + 10px);top:10px;width:272px;max-height:calc(100% - 20px);overflow-y:auto;z-index:1100;background:var(--panel);box-shadow:var(--sh);transition:left .3s cubic-bezier(.3,.7,.2,1)}
body.dopen .layer{left:calc(var(--railw) + var(--draw) + 10px)}
.lh{display:flex;align-items:center;gap:8px;padding:14px 10px 12px 20px}
.lh h2{flex:1;margin:0;font:600 13px/1.3 var(--ff);color:var(--ink)}
.lh button{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;background:none;color:var(--text);cursor:pointer}
.lh button svg{width:14px;height:14px;stroke-width:1.6;transition:transform .25s}
.layer.min .lh button svg{transform:rotate(180deg)}
.layer.min .lbd{display:none}
.lbd{padding:0 20px 16px}
.ld{margin:0 0 14px;font-size:11px;line-height:1.5;color:var(--dim)}
.lg{display:grid;grid-template-columns:106px minmax(0,1fr);gap:0 14px}
.lt{margin:0 0 7px;font-size:10.5px;color:var(--text)}
.lt span{color:var(--dim)}
.lt2{margin-top:14px}
.rd{display:flex;align-items:center;gap:8px;width:100%;padding:4px 0;border:0;background:none;color:var(--text);font:400 11px/1.3 var(--ff);text-align:left;cursor:pointer}
.rd i{flex:none;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--dim)}
.rd:hover{color:var(--ink)}
.rd.on{color:var(--accent);font-weight:600}
.rd.on i{border:0;background:var(--accent);box-shadow:0 0 0 3px rgba(79,209,197,.18)}
.inl{display:flex;gap:14px;margin-bottom:12px}.inl .rd{width:auto}
.vleg{display:flex;gap:10px;height:156px}
.vleg .bar{display:flex;flex-direction:column;gap:2px;width:12px;flex:none;border-radius:6px;overflow:hidden}
.vleg .bar i{display:block}
.vleg .lab{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.vleg .lab span{display:flex;flex-direction:column;justify-content:center;font-size:10.5px;line-height:1.25;color:var(--text)}
.vleg .lab em{font-style:normal;font-size:10px;color:var(--dim)}
.fam{margin:9px 0 2px;font-size:10px;color:var(--dim);text-transform:uppercase}
.fam:first-of-type{margin-top:0}
.cl{display:flex;align-items:center;gap:8px;width:100%;padding:3.5px 0;border:0;background:none;color:var(--text);font:400 11px/1.3 var(--ff);text-align:left;cursor:pointer}
.cl i{flex:none;width:9px;height:9px;border-radius:50%}
.cl span{flex:1}.cl em{font-style:normal;font-size:10px;color:var(--dim)}
.cl:hover{color:var(--ink)}
.cl.on{color:var(--accent);font-weight:600}.cl.off{opacity:.42}
.layer select{width:100%;padding:6px 8px;border:0;border-radius:0;background:var(--panel2);color:var(--text);font:400 11px var(--ff)}
.tg{display:flex;align-items:center;gap:10px;margin-top:14px;padding:0;border:0;background:none;color:var(--text);font:400 11px var(--ff);cursor:pointer}
.tg i{position:relative;flex:none;width:28px;height:14px;border-radius:7px;background:#34425c;transition:background .2s}
.tg i::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#cfd8e6;transition:left .2s,background .2s}
.tg.on i{background:var(--accent)}.tg.on i::after{left:16px;background:#04121a}
.ln{margin:12px 0 0;font-size:10px;color:var(--dim)}

/* ---------- drawer (explore, download, info, views) ---------- */
.drawer{position:fixed;left:var(--railw);top:0;bottom:0;width:var(--draw);z-index:1150;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);box-shadow:2px 0 6px rgba(0,0,0,.45);transform:translateX(-105%);visibility:hidden;transition:transform .3s cubic-bezier(.3,.7,.2,1),visibility 0s .3s}
.drawer.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.3,.7,.2,1)}
.dh{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:16px;padding:20px 12px 14px 20px;background:var(--panel)}
.dh b{font:700 13px/1 var(--ff);text-transform:uppercase;color:var(--ink)}
.dh .pin{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text)}
.dh .pin svg{width:14px;height:14px}
.dh .x{margin-left:auto;width:30px;height:30px;border:0;background:none;color:var(--dim);font:400 20px/1 var(--ff);cursor:pointer}
.dh .x:hover{color:var(--ink)}
.db{padding:2px 20px 30px}
.db p{margin:0 0 12px;font-size:12.5px;line-height:1.6}
.db h4{margin:22px 0 8px;font:600 11.5px/1.3 var(--ff);text-transform:uppercase;color:var(--ink)}
.db h4:first-child{margin-top:6px}
.bk{display:inline-flex;align-items:center;gap:6px;margin:0 0 14px;padding:0;border:0;background:none;color:var(--accent);font:600 11.5px var(--ff);cursor:pointer}
.bk svg{width:12px;height:12px;stroke-width:1.8}
.lk h3{margin:0;font:700 28px/1.08 var(--fc);color:var(--ink)}
.lm{margin:5px 0 0!important;font-size:11.5px!important;color:var(--dim)}
.beh{display:flex;gap:9px;margin:14px 0 0;font-size:12.5px;line-height:1.55}
.beh i{flex:none;width:9px;height:9px;margin-top:5px;border-radius:50%}
.beh b{color:var(--ink);font-weight:600}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:18px 0 20px}
.tri div{padding:0 12px;border-left:1px solid var(--hair)}
.tri div:first-child{padding-left:0;border-left:0}
.tri span{display:block;font-size:10.5px;color:var(--dim)}
.tri b{display:flex;align-items:center;gap:6px;margin-top:2px;font:700 23px/1.15 var(--fc);color:var(--ink)}
.tri b svg{width:9px;height:9px;flex:none}
.tri b.ns{font:500 15px/1.75 var(--fc);color:var(--dim)}
.tri em{display:block;font-style:normal;font-size:10px;color:var(--dim)}
.acc section{border-top:1px solid var(--hair)}
.acc section:last-child{border-bottom:1px solid var(--hair)}
.ah{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 10px;border:1px solid transparent;background:none;color:var(--dim);font:600 11.5px/1 var(--ff);text-transform:uppercase;text-align:left;cursor:pointer}
.ah:hover{color:var(--ink)}
.ah svg.ic{width:20px;height:20px;flex:none}
.ah span{flex:1}
.ah svg.ch{width:14px;height:14px;flex:none;color:var(--accent);stroke-width:1.7;transition:transform .25s}
section.open>.ah{color:var(--ink);border-color:var(--accent)}
section.open>.ah svg.ch{transform:rotate(180deg)}
.ab{display:none;padding:16px 2px 20px}
section.open>.ab{display:block}
.ab h5{margin:20px 0 8px;font:600 11px/1.3 var(--ff);color:var(--text)}
.story{margin:14px 0 0!important;font-size:12.5px!important;line-height:1.65!important;color:var(--text)}
.story b{color:var(--ink);font-weight:600}
.keys{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:6px;font-size:11px;color:var(--text)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:9px;height:9px}
.keys .dash{width:14px;height:0;border-top:2px dashed var(--ink)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:500 10px var(--fc);fill:#7c8aa3}
.ctip{position:absolute;z-index:3;pointer-events:none;min-width:150px;padding:8px 10px;background:var(--rail);box-shadow:0 2px 8px rgba(0,0,0,.6);font-size:11.5px;line-height:1.5;opacity:0;transition:opacity .12s}
.ctip b{display:block;font:700 13px var(--fc);color:var(--ink)}
.ctip .r{display:flex;justify-content:space-between;gap:12px;color:var(--dim)}
.ctip .r em{font-style:normal;font-weight:600;color:var(--ink)}
.ctip .r i{display:inline-block;width:8px;height:8px;margin-right:6px}
table.tt{width:100%;border-collapse:collapse;font-size:12px}
.tt th{padding:0 0 6px;font:400 10.5px var(--ff);color:var(--dim);text-align:right}
.tt th:first-child,.tt td:first-child{text-align:left}
.tt td{padding:7px 0;border-top:1px solid var(--hair);text-align:right;white-space:nowrap}
.tt td:first-child i{display:inline-block;width:9px;height:9px;margin-right:8px}
.tt .v{font:700 14px var(--fc);color:var(--ink)}
.tt .ok{color:var(--dim)}
.tnote{margin-top:8px;font-size:10.5px;line-height:1.5;color:var(--dim)}
.sg{display:grid;grid-template-columns:118px 86px minmax(0,1fr);font-size:12px}
.sg>*{padding:7px 0;border-top:1px solid var(--hair)}
.sg span{color:var(--dim)}
.sg b{font:700 14px/1.4 var(--fc);color:var(--ink)}
.sg em{font-style:normal;font-size:11px;line-height:1.45;color:var(--dim)}
.bud{display:grid;grid-template-columns:70px minmax(0,1fr) 124px;gap:8px 10px;align-items:center;font-size:12px}
.bud .bt{position:relative;height:14px}
.bud .bt::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;border-left:1px solid #2a3a55}
.bud .bt i{position:absolute;top:2px;height:10px}
.bud em{font:600 12px var(--fc);font-style:normal;color:var(--ink);text-align:right;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px;font-size:12px}
.facts div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--hair);color:var(--dim)}
.facts b{font-weight:600;color:var(--ink);text-align:right}
.u{font-family:var(--ff)}
.rankline{margin-top:6px;font-size:12px;color:var(--dim)}.rankline b{color:var(--ink)}
.rk ol{margin:0;padding:0;list-style:none;counter-reset:i}
.rk li{counter-increment:i;display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--hair);font-size:12.5px;cursor:pointer}
.rk li::before{content:counter(i);width:16px;font-size:10.5px;color:var(--dim)}
.rk li .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk li:hover .n{color:var(--accent)}
.rk li .v{font:600 13px var(--fc);color:var(--ink)}
.rk li.empty{cursor:default;color:var(--dim)}.rk li.empty::before{content:none}
.vw{display:flex;gap:12px;width:100%;padding:10px 0;border:0;border-top:1px solid var(--hair);background:none;text-align:left;cursor:pointer;color:var(--text)}
.vw i{flex:none;width:14px;height:14px;margin-top:2px;border-radius:50%;border:1.5px solid var(--dim)}
.vw b{display:block;font:600 13px var(--ff);color:var(--ink)}
.vw span{display:block;font-size:11px;line-height:1.45;color:var(--dim)}
.vw.on i{border:0;background:var(--accent);box-shadow:0 0 0 3px rgba(79,209,197,.18)}
.vw.on b{color:var(--accent)}
.pill{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 18px;border:0;border-radius:999px;background:var(--accent);color:#04121a;font:700 10.5px/1 var(--ff);text-transform:uppercase;cursor:pointer}
.pill:hover{background:#8de8df;text-decoration:none}
.pill.ghost{background:none;box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.pill.ghost:hover{background:rgba(79,209,197,.12)}

/* ---------- map furniture ---------- */
.leaflet-container{font:inherit;background:#05080f}
.leaflet-tooltip.tip{padding:6px 9px;border:0;border-radius:0;background:var(--rail);color:var(--ink);box-shadow:var(--sh);font:12px/1.4 var(--ff)}
.leaflet-tooltip.tip::before{display:none}
.tip b{font-weight:600}.tip span{color:var(--dim)}
.leaflet-control-attribution{background:rgba(6,10,18,.8)!important;color:#7c8aa3!important;font:10px var(--ff)!important}
.leaflet-control-attribution a{color:#7c8aa3!important}
.leaflet-control-scale-line{border:1px solid #8793a8!important;border-top:0!important;background:var(--rail)!important;color:#cfd8e6!important;font:600 10px/1.4 var(--ff)!important;padding:2px 8px!important;text-shadow:none!important}
.leaflet-bottom.leaflet-right .leaflet-control-scale{margin:0 20px 8px 0}
.lp .leaflet-popup-content-wrapper{padding:0;border-radius:0;background:var(--panel);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.6)}
.lp .leaflet-popup-content{margin:0;padding:14px 16px 16px;font:12px/1.45 var(--ff)}
.lp .leaflet-popup-tip-container{display:none}
.lp a.leaflet-popup-close-button{top:8px;right:8px;width:20px;height:20px;color:var(--dim);font:400 18px/20px var(--ff)}
.lp a.leaflet-popup-close-button:hover{color:var(--ink);background:none}
.pp .pn{display:block;padding-right:20px;font:700 18px/1.2 var(--fc);color:var(--ink)}
.pp .pm{display:block;font-size:11px;color:var(--dim)}
.pp .pv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 8px;margin:10px 0 0}
.pp .pv span{display:block;font-size:10px;color:var(--dim)}
.pp .pv b{font:700 15px/1.3 var(--fc);color:var(--ink)}
.pp .pv b.ns{font-weight:500;font-size:13px;color:var(--dim)}
.pp .pu{display:block;margin-top:1px;font-size:10px;color:var(--dim)}
.pp svg{display:block;margin:9px 0 7px}
.pp svg text{font:500 9px var(--fc);fill:#7c8aa3}
.pp .pb{display:flex;align-items:flex-start;gap:7px;font-size:11.5px;line-height:1.4}
.pp .pb i{flex:none;width:8px;height:8px;margin-top:4px;border-radius:50%}
.pp .pbtn{display:flex;gap:8px;margin-top:13px}
.bm-img{filter:brightness(var(--bmb,.6)) saturate(.82);transition:filter .35s}
.bm-lab{opacity:.88}
.bmenu{position:fixed;right:20px;top:64px;z-index:1100;display:none;min-width:164px;padding:12px 18px 10px 16px;background:var(--panel);box-shadow:var(--sh)}
.bmenu.open{display:block}
.bmenu p{margin:0 0 5px;font-size:10.5px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:26px;z-index:1300;transform:translateX(-50%);padding:9px 16px;background:var(--rail);color:var(--ink);font-size:12px;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}

/* ---------- inside the homepage frame ---------- */
.embed{--rih:min(72px,calc(100vh/9.2))}
.embed .logo{display:none}
@media (max-width:1180px){:root{--draw:360px}body.dopen .layer{display:none}}

/* ---------- phones: logo corner, controls corner, tab bar at the bottom ---------- */
@media (max-width:820px){
  :root{--draw:100%}
  #map{left:0;bottom:58px}
  .rail{top:auto;right:0;width:auto;height:58px;flex-direction:row;box-shadow:0 -2px 4px rgba(0,0,0,.6)}
  .rail-views{display:none}
  .rail-tools{display:flex;width:100%;margin:0!important}
  .rail button{flex:1;width:auto;height:58px}
  .m-only{display:flex!important}
  .logo{position:fixed;left:0;top:0;width:62px;height:62px;box-shadow:var(--sh)}
  .logo b{font-size:21px}.logo b+b{font-size:14px}.logo i{font-size:7.5px}
  .topbar{right:10px;top:10px}
  .bmenu{right:10px;top:54px}
  .topbar button{width:36px}
  .layer{left:0!important;right:0;top:auto;bottom:58px;width:auto;max-height:62vh;display:none;box-shadow:0 -2px 6px rgba(0,0,0,.6)}
  body.legend .layer{display:block}
  .layer.min .lbd{display:block}
  .lg{grid-template-columns:130px minmax(0,1fr)}
  .drawer{left:0;right:0;top:auto;bottom:58px;width:auto;max-height:60vh;transform:translateY(110%);box-shadow:0 -2px 6px rgba(0,0,0,.6)}
  .dh{padding-top:16px}
  .toast{bottom:74px}
  .leaflet-bottom.leaflet-right .leaflet-control-scale{display:none}
}

<script>
(function(){
  var C={dec:'#e66767',inc:'#3987e5',neu:'#64748b',perm:'#199e70',seas:'#9085e9',ink:'#f1f5fb',dim:'#7c8aa3',grid:'#172238',axis:'#2a3a55'};

  /* ---------- rankings for the current view ---------- */
  function rankings(){

    function by(fn,dir){return function(a,b){return dir*(fn(a)-fn(b))}}

  /* real lake outlines (HydroLAKES), shown once a lake is big enough on screen */

    g+='<line x1="'+xv+'" x2="'+xv+'" y1="2" y2="48" stroke="'+C.ink+'" stroke-width="2"/><circle cx="'+xv+'" cy="2" r="3.5" fill="'+C.ink+'"/>';
    g+='<text x="'+Lm+'" y="60">−30% or less</text><text x="'+(Lm+iw/2)+'" y="60" text-anchor="middle">0</text><text x="'+(W-R)+'" y="60" text-anchor="end">+30% or more</text>';
    return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Permanent-water trends of all lakes, with this lake marked">'+g+'</svg></div>'+
      '<div class="rankline">Permanent-water trend ranks <b>'+rank+' of '+N+'</b> (1 = fastest loss).</div>';
  }
  function facts(l){
    function vol(v){if(v==null)return '–';return v>=1000?(v/1000).toFixed(v>=10000?0:1)+' km³':Math.round(v).toLocaleString('en')+' million m³'}
    function rt(d){if(d==null||d<=0)return '–';return d>=730?(d/365).toFixed(d>=3650?0:1)+' years':Math.round(d)+' days'}
    var f=[['Type',TYPE[l.type]||'–'],['Outline area',l.area_hl!=null?km(l.area_hl)+' km²':'–'],['Mean depth',l.depth!=null?l.depth+' m':'–'],['Volume',vol(l.vol)],
      ['Residence time',rt(l.res)],['Elevation',l.elev!=null?Math.round(l.elev).toLocaleString('en')+' m':'–'],['Watershed',l.wshd!=null?Math.round(l.wshd).toLocaleString('en')+' km²':'–'],['Shoreline index',l.shore!=null?l.shore.toFixed(2):'–']];
    return '<div class="facts">'+f.map(function(x){return '<div><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'}).join('')+'</div><div class="tnote">From HydroLAKES (lake '+l.id+'). Shoreline index: 1 = a perfect circle; higher = a more irregular shore.</div>';
  }

  /* ---------- drawer ---------- */
  function sec(k,title,icon,body){return '<section class="'+(state.acc[k]?'open':'')+'" data-k="'+k+'"><button class="ah" aria-expanded="'+!!state.acc[k]+'">'+ic(icon,'ic')+'<span>'+title+'</span>'+ic(I.chev,'ch')+'</button><div class="ab">'+body+'</div></section>'}
  function exploreBody(){
    var l=state.open;
    if(l&&!state.lists){var R=REG[l.reg];
      return '<button class="bk" data-a="lists">'+ic(I.back)+'Rankings</button>'+
        '<div class="lk"><h3>'+esc(nm(l))+'</h3><p class="lm">'+(TYPE[l.type]||'Lake')+' · '+esc(l.cont)+'</p>'+
        '<div class="beh"><i style="background:'+FAM[R.f][1]+'"></i><span><b>'+R.n+'.</b> '+R.d+'</span></div>'+tri(l)+'</div>'+
        '<div class="acc">'+
        sec('year','Water, year by year',I.explore,'<div class="chart">'+mainChart(l)+'<div class="ctip"></div></div><div class="keys"><span><i style="background:'+C.perm+'"></i>Permanent</span><span><i style="background:'+C.seas+'"></i>Seasonal</span><span><i class="dash"></i>Trend of total water</span></div><p class="story">'+story(l)+'</p>')+
        sec('tr','Trends',I.shift,trendTable(l)+'<h5>Seasonal share of the water</h5><div class="chart">'+shareChart(l)+'<div class="ctip"></div></div>')+
        sec('sig','Signals',I.reg,signals(l)+'<h5>1984–93 compared with 2012–21</h5>'+budget(l))+
        sec('lake','Lake facts',I.perm,facts(l)+'<h5>Among all '+LAKES.length+' lakes</h5>'+context(l)+
          '<p class="tnote" style="margin-top:14px">See this lake’s satellite images in my <a href="https://risarezaei.projects.earthengine.app/view/gsw-lake-explorer" target="_blank" rel="noopener">GSW Lake Explorer ↗</a></p>')+
        '</div>';
    }
    var h='<p>'+(l?'':'Select a lake by clicking on the map, or pick one from the rankings below. ')+'Rankings follow the current view: <b style="color:var(--ink);font-weight:600">'+VIEWS[state.v].t+'</b>.</p><div class="rk">';
    rankings().forEach(function(r,ri){var named=r[1].filter(function(x){return x.name}).slice(0,8);
      h+='<h4>'+r[0]+'</h4><ol>'+(named.length?named.map(function(x){return '<li data-id="'+x.id+'"><span class="n">'+esc(x.name)+'</span><span class="v">'+r[2](x)+'</span></li>'}).join(''):'<li class="empty">None with the current filters</li>')+'</ol>'});
    return h+'</div>';
  }
  function downloadBody(){return '<p>The full table behind this map, one row per lake:</p><p>yearly permanent and seasonal water (km², 1984–2021), the three trends with their p-values, the Mann–Kendall and Sen’s-slope check, seasonal share, abrupt shift, record years and behaviour class.</p>'+
    '<p style="margin-top:18px"><a class="pill" href="'+CSV+'" download="gsw-lake-trends.csv">Download CSV</a></p><p class="tnote">563 lakes · 0.4 MB · lake IDs match HydroLAKES v1.0</p>'}
  function infoBody(){return '<h4>About this map</h4><p>38 years of lake water, seen from space: yearly permanent and seasonal water for 563 lakes worldwide, from JRC Global Surface Water (Landsat), measured with the same code as my <a href="https://risarezaei.projects.earthengine.app/view/gsw-lake-explorer" target="_blank" rel="noopener">GSW Lake Explorer</a>.</p>'+
    '<p>Pick a view on the left, click a lake for a short summary, then choose Explore for its full profile. Zoom in and the dots become real lake outlines over the satellite image. The map button at the top right switches between satellite imagery and a plain dark map.</p>'+
    '<h4>Method</h4><p>Lake outlines come from HydroLAKES v1.0 and yearly water classes from JRC Global Surface Water v1.4 (Landsat, 1984–2021). For each lake, permanent water (water in every observed month of a year) and seasonal water (water in only some of those months) are summed inside its outline plus a buffer of 50·√A metres (at least 300 m; A = lake area in km²), at a pixel size adapted to lake size: 30 m for lakes under 225 km², coarser for larger ones.</p>'+
    '<p>Years in which more than 5% of this area had no Landsat observation are left out. Each lake needs at least 10 such years and a mean permanent water area of at least 0.05 km².</p>'+
    '<p>Trends are least-squares linear regressions, significant at p &lt; 0.05 and given per decade: permanent water as % of the lake’s mean permanent area, seasonal and total water as % of its mean total area. Every trend is cross-checked with the Mann–Kendall test and Sen’s slope. Abrupt shifts use the Pettitt change-point test on total water (p &lt; 0.05, at least 3 years on each side).</p>'+
    '<p>Behaviour follows the signs of the significant permanent, seasonal and total trends. Lakes with none are a “Step change” if a shift of 10% or more is significant, “Pulsing” if total water varies by 20% or more between years or over 30% of it is seasonal, and otherwise “Stable”.</p>'+
    '<p>Lake facts (type, depth, volume, residence time, watershed) come from HydroLAKES.</p>'+
    '<p>The satellite basemap (Esri World Imagery) is a recent mosaic of images. It shows roughly how a lake looks today, so it can differ from the lake’s 1984–2021 record.</p>'+
    (isEmbed?'':'<p style="margin-top:20px"><a class="pill ghost" href="index.html#lake-map">Back to my site</a></p>')}
  function viewsBody(){return VORDER.map(function(k){return '<button class="vw'+(k===state.v?' on':'')+'" data-v="'+k+'"><i></i><span><b>'+VIEWS[k].t+'</b><span>'+VIEWS[k].d+'</span></span></button>'}).join('')}
  function renderDrawer(){
    var t=state.drawer,el=$('drawer');if(!t)return;var keep=el.scrollTop,l=state.open,pin='';
    if(t==='explore'&&l&&!state.lists)pin='<span class="pin">'+ic(I.pin)+l.lat.toFixed(2)+', '+l.lon.toFixed(2)+'</span>';
    el.innerHTML='<div class="dh"><b>'+{explore:'Explore',download:'Download',info:'Info',views:'Views'}[t]+'</b>'+pin+'<button class="x" data-a="close" aria-label="Close">×</button></div><div class="db">'+
      (t==='explore'?exploreBody():t==='download'?downloadBody():t==='info'?infoBody():viewsBody())+'</div>';
    if(t==='explore'&&l&&!state.lists)hookCharts(el,l);
    el.scrollTop=renderDrawer.same===t+(l?l.id:'')+state.lists?keep:0;renderDrawer.same=t+(l?l.id:'')+state.lists;
  }
  function syncRail(){
    document.querySelectorAll('#railViews button').forEach(function(b){b.classList.toggle('on',b.dataset.v===state.v)});
    document.querySelectorAll('#railTools button').forEach(function(b){var d=b.dataset.d;b.classList.toggle('on',d==='legend'?document.body.classList.contains('legend'):d===state.drawer)});
  }
  function openDrawer(t){state.drawer=t;document.body.classList.add('dopen');document.body.classList.remove('legend');var el=$('drawer');el.classList.add('open');el.setAttribute('aria-hidden','false');renderDrawer();syncRail()}
  function closeDrawer(){state.drawer=null;document.body.classList.remove('dopen');var el=$('drawer');el.classList.remove('open');el.setAttribute('aria-hidden','true');syncRail();if(!curPop&&state.open)clearSel()}
  $('drawer').addEventListener('click',function(e){
    var a=e.target.closest('[data-a]'),li=e.target.closest('li[data-id]'),ah=e.target.closest('.ah'),vw=e.target.closest('.vw');
    if(a&&a.dataset.a==='close'){closeDrawer();return}
    if(a&&a.dataset.a==='lists'){state.lists=true;renderDrawer();return}
    if(li){var l=LAKES.filter(function(x){return x.id===+li.dataset.id})[0];if(l){state.lists=false;focusLake(l)}return}
    if(ah){var s=ah.parentNode,k=s.dataset.k;state.acc[k]=!state.acc[k];s.classList.toggle('open',state.acc[k]);ah.setAttribute('aria-expanded',state.acc[k]);return}
    if(vw){setView(vw.dataset.v);closeDrawer()}
  });
  function setView(v){state.v=v;state.reg=null;state.dec=null;if(v==='share')state.sig=false;syncRail();refresh()}

  /* ---------- rail, controls, start ---------- */
  $('railViews').innerHTML=VORDER.map(function(k){return '<button data-v="'+k+'" title="'+VIEWS[k].t+'">'+ic(I[k])+'<span>'+VIEWS[k].s+'</span></button>'}).join('');
  $('railTools').innerHTML=[['views','Views',1],['legend','Legend',1],['explore','Explore'],['download','Download'],['info','Info']].map(function(t){return '<button data-d="'+t[0]+'"'+(t[2]?' class="m-only"':'')+'>'+ic(I[t[0]])+'<span>'+t[1]+'</span></button>'}).join('');
  $('railViews').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setView(b.dataset.v)});
  $('railTools').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset.d;
    if(d==='legend'){if(state.drawer)closeDrawer();document.body.classList.toggle('legend');syncRail();return}
    if(state.drawer===d)closeDrawer();else{if(d==='explore'&&!state.open)state.lists=true;openDrawer(d)}});
  $('topbar').innerHTML=[['out','Zoom out',I.minus],['in','Zoom in',I.plus],['home','Whole world',I.globe],['base','Change the basemap',I.map],['share','Copy a link to this view',I.share2],['help','About this map',I.help]].map(function(b){return '<button data-b="'+b[0]+'" title="'+b[1]+'" aria-label="'+b[1]+'">'+ic(b[2])+'</button>'}).join('');
  $('topbar').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var k=b.dataset.b;
    if(k==='out')map.zoomOut();else if(k==='in')map.zoomIn();else if(k==='home')home();else if(k==='base')$('bmenu').classList.toggle('open');else if(k==='help')openDrawer('info');
    else{var u=location.origin+location.pathname+'?view='+state.v+(state.base!=='sat'?'&base='+state.base:'')+(state.open?'&lake='+state.open.id:'');
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(function(){toast('Link copied')},function(){toast(u)});else toast(u)}});
  addEventListener('keydown',function(e){if(e.key!=='Escape')return;if($('bmenu').classList.contains('open'))$('bmenu').classList.remove('open');else if(curPop)map.closePopup();else if(state.drawer)closeDrawer()});

  fetch('assets/data/lake-dossier.json').then(function(r){return r.json()}).then(function(J){
    LAKES=J.lakes;
    var qv=/[?&]view=(\w+)/.exec(location.search);if(qv&&VIEWS[qv[1]])state.v=qv[1];
    var qb=/[?&]base=(\w+)/.exec(location.search),sb=null;try{sb=localStorage.getItem('lt-base')}catch(e){}
    state.base=qb&&BASES[qb[1]]?qb[1]:(sb&&BASES[sb]?sb:'sat');
    initMap();syncRail();refresh();
    var q=/[?&]lake=(\d+)/.exec(location.search);if(q){var l=LAKES.filter(function(x){return x.id===+q[1]})[0];if(l)setTimeout(function(){focusLake(l)},300)}
  });
})();
</script>
<script src="assets/fx.js" data-fx="map" defer></script>
</body>
</html>
